<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Native Tails Invoice Generator</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--tx:#1d1d2b;--mu:#666;--ac:#7b4fa0;--bd:#d9dbe3;--inb:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161d;--card:#20212b;--tx:#eceef5;--mu:#9a9db0;--bd:#3a3c4b;--inb:#2a2b37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Arial,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:20px;padding:16px;max-width:1300px;margin:auto}
.form{flex:1 1 380px;background:var(--card);border-radius:12px;padding:16px}
.prev{flex:1 1 560px;overflow-x:auto}
h2{margin:14px 0 6px;font-size:15px;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
input,textarea{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--inb);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:8px}
.item .row{margin-top:4px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;margin:8px 6px 0 0}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:transparent;color:#c33;border:1px solid #c33;padding:4px 8px;margin:6px 0 0}
#inv{background:#fff;color:#111;width:794px;min-height:1000px;padding:48px 48px 40px;margin:auto;font-size:12px;box-shadow:0 2px 12px #0002}
#inv .top{display:flex;justify-content:space-between}
#inv .logo{max-height:90px;max-width:200px}
#inv .r{text-align:right;font-size:11px;line-height:1.6}
#inv .r b{font-size:14px;font-weight:400}
#inv h4{margin:0 0 4px;font-size:14px;font-weight:400}
#inv .sm{font-size:11px;line-height:1.55;white-space:pre-line}
#inv hr{border:0;border-top:1px solid #ddd;margin:26px 0}
#inv table{width:100%;border-collapse:collapse;font-size:11px;margin-top:50px}
#inv th{font-weight:400;text-align:left;padding:6px 0 10px;border-bottom:2px solid #444}
#inv td{padding:12px 0;vertical-align:top}
#inv tr.last td{border-bottom:2px solid #444}
#inv .n{text-align:right}
#inv .tot{width:48%;margin:30px 0 0 auto;font-size:11px}
#inv .tot div{display:flex;justify-content:space-between;padding:8px 0}
#inv .tot .l{border-top:1px solid #ddd}
#inv .tot .b{border-top:2px solid #444;border-bottom:2px solid #444;margin-top:8px;padding:10px 0}
#inv .note{margin-top:30px;font-size:11px;white-space:pre-line}
#inv{position:relative}#inv .stamp{position:absolute;top:150px;right:70px;border:4px solid #2a9d4b;color:#2a9d4b;font:700 32px Arial,sans-serif;padding:4px 18px;border-radius:8px;transform:rotate(-12deg);opacity:.75;letter-spacing:3px}
#logos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}#logos button{width:78px;height:78px;padding:5px;margin:0;background:#d5d8e2;border:3px solid transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#333;font-size:11px}#logos button.on{border-color:var(--ac)}#logos img{max-width:100%;max-height:100%}
@media print{#inv{zoom:1!important}body{background:#fff}.form{display:none}.wrap{padding:0;display:block}.prev{overflow:visible}#inv{box-shadow:none;margin:0;width:100%}@page{margin:0}}
</style></head><body>
<div class="wrap">
<div class="form">
<h2 style="margin-top:0">Invoice details</h2>
<div class="row"><div><label>Invoice #</label><input id="no" value="3"></div><div><label>Order number</label><input id="ord" value="NT-2026-069"></div></div>
<div class="row"><div><label>Issue date</label><input id="iss" type="date"></div><div><label>Due date</label><input id="due" type="date"></div></div>
<h2>Customer</h2>
<label>Name</label><input id="cn">
<label>Address</label><textarea id="ca" rows="3"></textarea>
<div class="row"><div><label>Email</label><input id="ce"></div><div><label>Phone</label><input id="cp"></div></div>
<h2>Items</h2><div id="items"></div>
<button class="s" onclick="addItem()">+ Add item</button>
<h2>Charges</h2>
<div class="row"><div><label>Discount (₹)</label><input id="disc" type="number" value="0"></div><div><label>Delivery fee (₹)</label><input id="del" type="number" value="0"></div></div>
<label>Extra note (optional, e.g. payment info, thanks)</label><textarea id="note" rows="2"></textarea>
<h2>Payment</h2>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" id="paid" style="width:auto" onchange="$('dt').value=this.checked?'Receipt':'Invoice';render()"> Already paid (adds PAID stamp, balance due ₹0)</label>
<div class="row"><div><label>Document title</label><select id="dt" style="width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--inb);color:var(--tx)"><option>Invoice</option><option>Receipt</option><option>Bill</option></select></div><div><label>Paid via (UPI / Cash)</label><input id="pm" placeholder="UPI"></div></div>
<label>Paid date</label><input id="pd" type="date">
<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin-top:12px"><input type="checkbox" id="qr" style="width:auto" checked> Show website QR at the bottom</label>
<label>QR caption</label><input id="qrt" value="Scan to visit nativetails.in">
<h2>Your business (saved in this browser)</h2>
<label>Business details</label><textarea id="biz" rows="8"></textarea>
<label>Logo (tap to choose)</label><div id="logos"></div><label>Or upload your own</label><input type="file" id="logo" accept="image/*">
<button id="pdfbtn" onclick="savePdf()">Download PDF</button><button class="s" onclick="window.print()">Print</button>
<div style="font-size:11px;color:var(--mu);margin-top:6px">Download PDF saves the invoice as a file.</div>
</div>
<div class="prev"><div id="inv"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const DEF_BIZ="Native Tails\nHarabala Path\nGuwahati 781004\nAssam\nIndia\nnativetailsindia@gmail.com\n8920257218\nCompany ID: Native Tails";
let logo="",items=[{n:"Chicken Jerky",s:"Size: 100 g",q:1,p:349}];
function st(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=v=>{if(!v)return"";const d=new Date(v+"T00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
function iso(d){return d.toISOString().slice(0,10)}
function drawItems(){
 $("items").innerHTML=items.map((it,i)=>`<div class="item"><input placeholder="Item name" value="${esc(it.n)}" oninput="items[${i}].n=this.value;render()">
 <input placeholder="Size / note (e.g. Size: 100 g)" style="margin-top:4px" value="${esc(it.s)}" oninput="items[${i}].s=this.value;render()">
 <div class="row"><input type="number" placeholder="Qty" value="${it.q}" oninput="items[${i}].q=this.value;render()"><input type="number" placeholder="Price" value="${it.p}" oninput="items[${i}].p=this.value;render()"></div>
 <button class="d" onclick="items.splice(${i},1);drawItems();render()">Remove</button></div>`).join("");
}
function addItem(){items.push({n:"",s:"",q:1,p:0});drawItems();render()}
function fit(){const i=$("inv"),w=i.parentElement.clientWidth;i.style.zoom=Math.min(1,(w-2)/794)||1}
window.addEventListener("resize",fit);
function render(){
 const paid=$("paid").checked,ttl=$("dt").value||"Invoice",pm=$("pm").value.trim().replace(/^upi$/i,"UPI");
 const net=items.reduce((a,i)=>a+(+i.q||0)*(+i.p||0),0),disc=+$("disc").value||0,del=+$("del").value||0,tot=net-disc+del;
 const rows=items.map((it,i)=>`<tr class="${i==items.length-1?"last":""}"><td>${esc(it.n)}${it.s?"<br>"+esc(it.s):""}</td><td>${esc(it.q)}</td><td>${m(it.p)}</td><td class="n">${m((+it.q||0)*(+it.p||0))}</td></tr>`).join("");
 $("inv").innerHTML=`${paid?'<div class="stamp">PAID</div>':""}<div class="top"><div>${logo?`<img class="logo" src="${logo}">`:""}</div>
 <div class="r"><b>${esc(ttl)} #${esc($("no").value)}</b><br>Issue date: ${fd($("iss").value)}<br>${paid?("Paid on: "+fd($("pd").value||$("iss").value)):"Due date: "+fd($("due").value)}<br>${paid&&pm?"Paid via: "+esc(pm)+"<br>":""}Order number: ${esc($("ord").value)}</div></div>
 <div class="sm" style="margin-top:30px"><h4>${esc($("biz").value.split("\n")[0])}</h4>${esc($("biz").value.split("\n").slice(1).join("\n"))}</div><hr>
 <div class="row" style="gap:40px"><div class="sm" style="flex:0 0 38%"><h4>Bill to</h4>${esc($("cn").value)}\n${esc($("ca").value)}</div>
 <div class="sm"><h4>Additional customer info</h4>${esc($("ce").value)}\n${esc($("cp").value)}</div></div>
 <table><tr><th>Item</th><th style="width:70px">Quantity</th><th style="width:80px">Price</th><th class="n" style="width:90px">Line total</th></tr>${rows}</table>
 <div class="tot"><div><span>Net total</span><span>${m(net)}</span></div>
 ${disc?`<div><span>Discount</span><span>−${m(disc)}</span></div>`:""}
 ${del?`<div><span>Delivery fee</span><span>${m(del)}</span></div>`:""}
 <div class="l"><span>Total</span><span>${m(tot)}</span></div>${paid?`<div><span>Amount paid</span><span>${m(tot)}</span></div>`:""}<div class="b"><span>Balance due</span><span>${m(paid?0:tot)}</span></div></div>
 ${$("note").value?`<div class="note">${esc($("note").value)}</div>`:""}
 ${$("qr").checked?`<div style="margin-top:40px;display:flex;align-items:center;gap:12px"><img src="${QR}" style="width:84px;height:84px"><span style="font-size:11px">${esc($("qrt").value)}</span></div>`:""}`;
 fit();st("nt_biz",$("biz").value);st("nt_no",$("no").value);
}
async function savePdf(){
 const b=$("pdfbtn"),old=b.textContent;b.textContent="Preparing…";
 try{
  const z=$("inv").style.zoom;$("inv").style.zoom="1";
  const c=await html2canvas($("inv"),{scale:2,backgroundColor:"#fff"});$("inv").style.zoom=z;
  const pdf=new window.jspdf.jsPDF("p","mm","a4");
  let w=210,h=c.height*w/c.width;if(h>297){w=w*297/h;h=297}
  pdf.addImage(c.toDataURL("image/jpeg",.95),"JPEG",(210-w)/2,0,w,h);
  pdf.save("Native-Tails-"+($("dt").value||"Invoice")+"-"+($("no").value||"x").replace(/[^\w-]/g,"")+".pdf");
 }catch(e){alert("Could not create the PDF. Try the Print button.")}
 finally{fit();b.textContent=old}
}
const t=new Date(),d2=new Date(t.getTime()+30*864e5);
$("iss").value=iso(t);$("due").value=iso(d2);
$("biz").value=ld("nt_biz")||DEF_BIZ;
if(ld("nt_no"))$("no").value=ld("nt_no");

function initLogos(){const g=$("logos"),up=ld("nt_logo");
 g.innerHTML=LOGOS.map((l,i)=>`<button type="button" data-i="${i}"><img src="${l}"></button>`).join("")+(up?`<button type="button" data-i="up"><img src="${up}"></button>`:"")+`<button type="button" data-i="none">No logo</button>`;
 g.onclick=e=>{const b=e.target.closest("button");if(b)pick(b.dataset.i)};
 let v=ld("nt_logosel");if(v==null||(v==="up"&&!up)||(v!=="none"&&v!=="up"&&!LOGOS[+v]))v="0";pick(v)}
function pick(v){logo=v==="none"?"":v==="up"?(ld("nt_logo")||""):LOGOS[+v];st("nt_logosel",v);[...$("logos").children].forEach(b=>b.classList.toggle("on",b.dataset.i===v));render()}
$("logo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{st("nt_logo",r.result);st("nt_logosel","up");initLogos()};r.readAsDataURL(f)};
document.querySelectorAll(".form input:not(#logo),.form textarea,.form select").forEach(e=>e.addEventListener("input",render));
drawItems();initLogos();
</script></body></html>
